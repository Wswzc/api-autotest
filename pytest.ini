[pytest]
# 显式声明项目根为导入根，保证 Windows 与 Linux(CI) 上的 import 行为一致
pythonpath = .
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    --tb=short
    --alluredir=./allure-results
    --clean-alluredir

markers =
    smoke: 冒烟用例，提测准入门禁使用
    regression: 全量回归用例
    security: 鉴权与安全专项
    p0: 最高优先级，每次提交都必须通过
    p1: 高优先级，每日回归
    p2: 中低优先级，版本回归
    slow: 执行较慢的用例

log_cli = false
log_cli_level = INFO
