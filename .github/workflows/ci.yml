name: API Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # UTC 18:00 = 北京时间次日凌晨 02:00，每日定时回归
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      env:
        description: '运行环境'
        default: 'local'
        type: choice
        options: [local, test]
      mark:
        description: '用例标记（留空跑全量）'
        default: ''

jobs:
  # 门禁作业：只跑冒烟用例，失败即阻止合并
  smoke:
    name: 冒烟门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行冒烟用例
        run: python -m pytest -m smoke --env=local --alluredir=allure-results

  # 全量回归：允许失败但必须产出报告，便于分析
  regression:
    name: 全量回归
    runs-on: ubuntu-latest
    needs: smoke
    # 仓库默认令牌为只读，推送报告到 gh-pages 分支需要显式提权
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行全量用例（并行）
        id: run
        continue-on-error: true
        run: |
          python -m pytest \
            --env=${{ github.event.inputs.env || 'local' }} \
            ${{ github.event.inputs.mark && format('-m {0}', github.event.inputs.mark) || '' }} \
            -n 4 \
            --alluredir=allure-results

      - name: 归档执行日志
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: run-logs
          path: logs/
          retention-days: 7

      - name: 归档 Allure 原始结果
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7

      # 首次运行时 gh-pages 分支尚不存在，拉取失败属于预期
      - name: 拉取历史报告数据（用于展示趋势）
        if: always()
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: 生成 Allure 报告
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_history: allure-history
          gh_pages: gh-pages
          keep_reports: 20

      # checkout 会在目录内留下 .git，它会被一并拷进待发布目录，
      # 导致发布动作无法在其中新建 gh-pages 分支（src refspec does not match any）
      - name: 清理待发布目录中的 git 元数据
        if: always()
        run: rm -rf allure-history/.git gh-pages/.git

      - name: 发布报告到 GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: 回归失败则让流水线失败
        if: steps.run.outcome == 'failure'
        run: |
          echo "全量回归存在失败用例，请查看 Allure 报告"
          exit 1
